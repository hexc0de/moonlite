# Moonlite nginx site: /etc/nginx/sites-available/moonlite
#
# deploy.sh renders this file and installs it on the printer. For a manual setup,
# replace the double-brace placeholders below (docs/DEPLOYMENT.md has a one-line command):
#   NGINX_PORT          port to serve Moonlite on, e.g. 80 or 81 (next to Mainsail)
#   ROOT_DIR            directory with the built dist/ files, e.g. /home/pi/moonlite
#   MOONRAKER_UPSTREAM  Moonraker address as seen from the printer, usually 127.0.0.1:7125
#   WEBCAM_UPSTREAM     webcam streamer (crowsnest/ustreamer), usually 127.0.0.1:8080

# Own name so it never collides with $connection_upgrade from Mainsail/Fluidd configs.
map $http_upgrade $moonlite_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen {{NGINX_PORT}};
    server_name _;

    access_log /var/log/nginx/moonlite-access.log;
    error_log /var/log/nginx/moonlite-error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    root {{ROOT_DIR}};
    index index.html;

    # G-code uploads go through this site (same origin as the UI).
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /websocket {
        proxy_pass http://{{MOONRAKER_UPSTREAM}}/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $moonlite_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://{{MOONRAKER_UPSTREAM}}$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 600;
    }

    location /webcam/ {
        postpone_output 0;
        proxy_buffering off;
        proxy_ignore_headers X-Accel-Buffering;
        access_log off;
        error_log off;
        proxy_pass http://{{WEBCAM_UPSTREAM}}/;
    }
}
